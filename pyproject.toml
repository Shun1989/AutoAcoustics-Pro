[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoacoustics-pro"
version = "0.3.1"
description = "Traceable desktop acoustic measurements for seat motors"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "licenses/source/*.txt"]
readme = "README.md"
dependencies = [
  "PyQt6", "pyqtgraph", "numpy", "scipy", "soundfile", "mosqito==1.2.1",
  "h5py", "nptdms", "python-docx", "matplotlib", "psutil", "nidaqmx", "httpx", "keyring", "numba", "sounddevice==0.5.6"
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]
corpus = ["pypdf", "pillow"]

[project.urls]
Repository = "https://github.com/Shun1989/AutoAcoustics-Pro"
Issues = "https://github.com/Shun1989/AutoAcoustics-Pro/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
